
<!DOCTYPE html>
<html>
<head>
<title>Continental Hotel Reservation Form</title>
</head>
<body style="background-color:white;font-family:times-new-roman;">
<form>

<table border="1" style="background-color:lightblue;width:500px;border-collapse:collapse;margin:0 auto;">
<tr>
<td style="font-weight:bold;width:35%;">
Name
</td>
<td>
<input type="text" placeholder="Enter your name" style="width:90%;">
</td>
</tr>
<tr>
<td style="font-weight:bold;">eMail</td>
<td>
<input type="text" value="info@continental.pk" style="width:90%;">
</td>
</tr>
<tr>
<td style="font-weight:bold;">
Mobile No
</td>
<td>
<input type="text" placeholder="Enter your cell number" style="width:90%;">
</td>
</tr>
<tr>
<td style="font-weight:bold;">
Arrival Time
</td>
<td>
<input type="text" placeholder="Enter your arrival time" style="width:60%;">
</td>
</tr>
<tr>
<td style="font-weight:bold;">
Departure
</td>
<td>
<input type="text" style="width:40%;">
<input type="text" style="width:40%;">
</td>
</tr>
<tr>
<td style="font-weight:bold;">
Room Type
</td>
<td>
<input type="radio" name="room">
Single
<input type="radio" name="room">
Double
<br>
<input type="radio" name="room">
Presidential Suite
</td>
</tr>
<tr>
<td style="font-weight:bold;">
Preferences
</td>
<td>
<input type="checkbox">
Non-Smoking
<br>
<input type="checkbox">
Internet
<br>
<input type="checkbox">
Firm Mattress
</td>
</tr>
<tr>
<td style="font-weight:bold;">
Mode of Payment
</td>
<td>
<input type="checkbox">
Cash
<input type="checkbox">
Check
<br>
<input type="checkbox">
Credit Card
<button type="button">
Select Card
</button>
</td>
</tr>
<tr>
<td colspan="2" style="text-align:center;">
<input type="submit" value="Send Data">
</td>
</tr>
</table>
</div>
</form>
</body>
</html>
